<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FIT</title>
    <script>
      // GitHub Pages has no server rewrites, and FIT uses #/ routes. Links that
      // arrive as real paths (the Claude sign-in page: /oauth/consent?...) are
      // turned into the matching #/ route. Anything else goes to the app home.
      var base = "/frontline-tracker/"
      var path = location.pathname
      var rest = path.indexOf(base) === 0 ? path.slice(base.length) : ""
      if (rest.indexOf("oauth/") === 0) {
        location.replace(base + "#/" + rest.replace(/\/$/, "") + location.search + location.hash)
      } else {
        location.replace(base)
      }
    </script>
  </head>
  <body></body>
</html>
